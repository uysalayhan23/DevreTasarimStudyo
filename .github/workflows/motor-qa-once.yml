name: H-L Motor QA (one-time push gate)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/motor-qa-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: H-L + motor canonical and simulation tests
        run: |
          node --version
          node --test tests/tutorial-installation-batch-h-v11920.test.cjs tests/tutorial-next-batch-i-v11920.test.cjs tests/tutorial-sensor-batch-j-v11920.test.cjs tests/tutorial-motor-batch-k-v11920.test.cjs tests/tutorial-dual-dc-batch-l-v11920.test.cjs tests/tutorial-motor-physical-regression-v11920.test.cjs
